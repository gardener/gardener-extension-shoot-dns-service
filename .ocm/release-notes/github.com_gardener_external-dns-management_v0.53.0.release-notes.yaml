  category: bugfix
  contents: 'The Google Cloud DNS provider (next-gen controller) is now self-healing
    when a Changes.Create call fails with 404: it re-fetches the live record sets
    and retries, recovering from cases where a wildcard record caused a spurious "not
    found" error during updates'
