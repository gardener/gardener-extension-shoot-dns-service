  contents: '`aws-route53` providers can only use `AWS_USE_CREDENTIALS_CHAIN` when
    the operator has enabled it via the environment variable `ALLOW_AWS_CREDENTIALS_CHAIN=true`
    on the dns-controller-manager. Otherwise the provider is rejected during validation.
    This is typically only relevant for stand alone deployments.'
  mimetype: text/markdown
