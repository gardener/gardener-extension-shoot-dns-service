- audience: operator
  author:
    hostname: github.com
    type: githubUser
    username: rickardsjp
  category: bugfix
  contents: The next-generation DNS controller no longer fails to create a TXT record
    (e.g. an ACME `_acme-challenge` DNS-01 challenge record) when a wildcard CNAME
    shadows the queried name. A CNAME answer to the pre-write TXT lookup is now treated
    as "no record present" instead of a hard error, so the record is created and certificate
    renewals proceed.
  mimetype: text/markdown
  reference: '[#1089](https://github.com/gardener/external-dns-management/pull/1089)'
  type: standard
